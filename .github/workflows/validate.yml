name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      # -backend=false: validate the configuration without touching any state or credentials.
      - run: terraform -chdir=bootstrap init -backend=false -input=false
      - run: terraform -chdir=bootstrap validate
